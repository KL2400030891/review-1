# ===========================================
# PostgreSQL Production Configuration
# For Render.com Deployment
# ===========================================
spring.application.name=placement-system
server.port=${SERVER_PORT:8080}

# ===========================================
# PostgreSQL (Render / Production)
# ===========================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10

# ===========================================
# JPA / Hibernate
# ===========================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.open-in-view=false

# ===========================================
# JWT
# ===========================================
app.jwt.secret=${JWT_SECRET:CHANGE_THIS_TO_STRONG_RANDOM_SECRET_IN_PRODUCTION}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# ===========================================
# CORS
# ===========================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://placement-system-frontend.onrender.com,http://localhost:5173}

# ===========================================
# H2 Disabled in Production
# ===========================================
spring.h2.console.enabled=false

# ===========================================
# Actuator
# ===========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ===========================================
# Logging
# ===========================================
logging.level.com.placement=INFO
logging.level.org.springframework.security=WARN
