services:
  # Backend Service (Spring Boot)
  - type: web
    name: placement-system-backend
    env: java
    region: oregon
    plan: free
    buildCommand: |
      cd backend && \
      mvn clean package -DskipTests
    startCommand: |
      cd backend && \
      java -jar target/placement-system-1.0.0.jar
    envVars:
      - key: JAVA_VERSION
        value: 17
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: 10000
      - key: SPRING_JPA_DATABASE_PLATFORM
        value: org.hibernate.dialect.PostgreSQLDialect
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: placement-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: placement-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: placement-db
          property: password
    healthCheckPath: /
    
  # Frontend Service (React/Vite) - Web Service with Node
  - type: web
    name: placement-system-frontend
    env: node
    region: oregon
    plan: free
    buildCommand: |
      cd frontend && \
      npm ci && \
      npm run build
    startCommand: |
      cd frontend && \
      npm install -g serve && \
      serve -s dist -l 3000
    envVars:
      - key: VITE_API_URL
        value: https://placement-system-backend.onrender.com
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000

# Database
databases:
  - name: placement-db
    plan: free
    ipAllowList: []
